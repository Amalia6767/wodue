name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public files
        run: python3 scripts/privacy_check.py
      - name: Test models and parsers
        run: zsh scripts/test.sh
      - name: Build app
        run: zsh scripts/build.sh
